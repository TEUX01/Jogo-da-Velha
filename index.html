```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo da Velha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <h1>🎮 Jogo da Velha</h1>

        <!-- SELEÇÃO DOS JOGADORES -->

        <section class="selection">

            <h2>Escolha os jogadores</h2>

            <label>
                Jogador ⭕
                <select id="playerO">
                    <option value="Teux">Teux</option>
                    <option value="Rafaela Cara de Panela">
                        Rafaela Cara de Panela
                    </option>
                </select>
            </label>

            <label>
                Jogador ❌
                <select id="playerX">
                    <option value="Rafaela Cara de Panela">
                        Rafaela Cara de Panela
                    </option>

                    <option value="Teux">
                        Teux
                    </option>
                </select>
            </label>

            <button id="startGame">
                Começar jogo
            </button>

        </section>


        <!-- PLACAR -->

        <section class="scoreboard">

            <div class="player">

                <h2 id="nameO">
                    Teux ⭕
                </h2>

                <span id="scoreO">0</span>

            </div>


            <div class="player">

                <h2 id="nameX">
                    Rafaela Cara de Panela ❌
                </h2>

                <span id="scoreX">0</span>

            </div>

        </section>


        <!-- VEZ DO JOGADOR -->

        <p id="turn">
            Escolha os jogadores para começar
        </p>


        <!-- TABULEIRO -->

        <section class="board">

            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>

        </section>


        <!-- BOTÕES -->

        <div class="buttons">

            <button id="newRound">
                🔄 Nova rodada
            </button>

            <button id="resetScore">
                🗑️ Zerar placar
            </button>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
```
